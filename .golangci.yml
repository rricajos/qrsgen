# golangci-lint v2 config
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # errors no manejados
    - govet          # bugs comunes
    - ineffassign    # asignaciones sin efecto
    - staticcheck    # análisis estático
    - unused         # vars/funcs sin uso
    - bodyclose      # http response body close
    - gosec          # vulnerabilidades de seguridad

  settings:
    staticcheck:
      checks:
        - all
        # Exclusions: APIs whatsmeow deprecated (todavía funcionan, migración futura)
        - "-SA1019"

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose
      # Comentarios en español no son misspell — desactivado el linter completo
      # (no enableable above) pero por si se reactiva, este exclude estaría:
      - text: "is a misspelling of"
        linters: [misspell]

# Notas:
# - misspell deshabilitado: comentarios en español/catalán flagean falsos positivos
# - errorlint deshabilitado: 4 issues legacy, fix en otro PR
# - SA1019 excluido: deprecación de APIs whatsmeow (DownloadAny, waProto.Message)
