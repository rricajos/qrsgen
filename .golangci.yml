# golangci-lint config (formato v1 — compatible con la action latest)
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: '1.24'

linters:
  disable-all: true
  enable:
    # Errores reales
    - errcheck       # errors no manejados
    - govet          # bugs comunes
    - ineffassign    # asignaciones sin efecto
    - staticcheck    # análisis estático completo
    - unused         # variables/funcs sin uso

    # Calidad
    - gosec          # vulnerabilidades de seguridad
    - misspell       # typos en comentarios
    - bodyclose      # http response body close
    - errorlint      # error wrapping

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
